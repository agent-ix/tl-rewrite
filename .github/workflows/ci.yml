name: CI

# Manual dispatch only, deliberately. There is no push or pull_request trigger:
# local `make guarded-ci` is the iteration gate, and a hosted run is dispatched
# once for a finalized revision so parallel pull-request work does not
# generate repeated billable runs.
on:
  workflow_dispatch:

jobs:
  msrv:
    name: Rust 1.75 Feature Boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check library and integration tests
        run: cargo check --locked --all-targets --all-features

  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      # Full history. The original reason — the compatibility view asking Git
      # whether the retained evidence bytes were the committed bytes — is gone
      # with the view, deleted under agent-ix/tl-rewrite#13. No gate in `make ci`
      # reads Git history any more. It is kept because Git history is now the
      # only integrity boundary for the deleted bytes, so a reviewer inspecting a
      # hosted run can still reach them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Candidate EA 0.4.1 matrix; release and human acceptance are still pending.
      - name: Install specification tools and modules
        run: |
          npm install --global --registry=https://registry.npmjs.org/ '@agent-ix/quire-cli@0.33.0' '@agent-ix/quoin@0.24.1' '@agent-ix/ix-flow@0.2.3'
          quoin module ensure-defaults
          quoin module install 'github:agent-ix/engineering-assurance//engineering_assurance@v0.4.1'

      - name: Install native Engineering Assurance
        run: cargo +1.98.1 install --git https://github.com/agent-ix/engineering-assurance --tag v0.4.1 --locked --bin engineering-assurance

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Complete local gate
        run: make guarded-ci

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny policy
        run: cargo deny check advisories licenses sources
