name: CI

# Manual dispatch only, deliberately. There is no push or pull_request trigger:
# local `make guarded-ci` is the iteration gate, and a hosted run is dispatched
# once for a finalized revision so parallel pull-request work does not
# generate repeated billable runs.
on:
  workflow_dispatch:

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check library and integration tests
        run: cargo check --locked --all-targets --all-features

  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install specification tools and modules
        run: |
          npm install --global '@agent-ix/quire-cli' '@agent-ix/quoin' '@agent-ix/ix-flow'
          quoin module ensure-defaults

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `make miri` runs on the nightly named by MIRI_TOOLCHAIN in the Makefile.
      # Read the name from the Makefile so there is no second copy to drift.
      - name: Read Miri toolchain name
        id: miri
        run: echo "toolchain=$(sed -n 's/^MIRI_TOOLCHAIN ?= //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Install Miri toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.miri.outputs.toolchain }}
          components: miri, rust-src

      - name: Build the Miri sysroot
        run: rustup run "${{ steps.miri.outputs.toolchain }}" cargo miri setup

      - name: Complete local gate
        run: make guarded-ci

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny policy
        run: cargo deny check advisories licenses sources
