# Kill-rate thresholds checked by scripts/mutation_gate.py (TL-231, TL-371).
# Kill rate = caught / (caught + missed + timeout); unviable mutants count on
# neither side. `min_kill_percent` is the floor measured by the first full
# `make mutants` run (a ratchet: raise it when survivors are killed, never
# lower it). The campaign targets are 95% for the core group and 85% for the
# whole crate. Every mutant that is missed or times out must be listed in a
# `[[survivor]]` table below with a one-line reason (FR-022-AC-5); a survivor
# without one fails the gate. Equivalent mutants are not listed here: they are
# excluded in .cargo/mutants.toml.
# `diff_min_kill_percent` applies to `make mutants-diff`: every mutant in the
# changed code must be killed.
diff_min_kill_percent = 100.0
exclude = ["src/ci_guard.rs", "src/bin/ci_guard.rs"]

# rewrite engine
[[group]]
name = "engine-core"
globs = ["src/engine/*.rs"]
min_kill_percent = 99.4

# whole crate
[[group]]
name = "crate"
globs = ["src/*.rs", "src/*/*.rs"]
min_kill_percent = 98.7

[[survivor]]
file = "src/engine/mod.rs"
reason = "differs only for a caller budget above the owner default of 100000 nodes, which needs a graph of that size to observe; the budget check just above refuses the same graph at the default budget"
names = [
    "delete field formula_nodes from struct SyntaxArtifactLimits expression in build_pass",
]

[[survivor]]
file = "src/equivalence.rs"
reason = "the trace enumeration visits every mask, so the mutated bit layout still finds a counterexample whenever one exists; only which counterexample is reported can differ"
names = [
    "replace * with + in trace",
]

[[survivor]]
file = "src/infinite.rs"
reason = "NonConvergent iteration count and the fairness identity guard: the catalog terminates, so no input reaches a repeated state, and each fairness operand is also refused by a later check with the same status"
names = [
    "replace + with * in rewrite_infinite",
    "replace + with - in rewrite_infinite",
    "replace || with && in rewrite_infinite",
]
