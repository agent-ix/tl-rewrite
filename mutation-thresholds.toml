# Kill-rate thresholds checked by scripts/mutation_gate.py (TL-231, TL-371).
# Kill rate = caught / (caught + missed + timeout); unviable mutants count on
# neither side. `min_kill_percent` is the floor measured by the first full
# `make mutants` run (a ratchet: raise it when survivors are killed, never
# lower it). The campaign targets are 95% for the core group and 85% for the
# whole crate. Every mutant that is missed or times out must be listed in a
# `[[survivor]]` table below with a one-line reason (FR-022-AC-5); a survivor
# without one fails the gate. Equivalent mutants are not listed here: they are
# excluded in .cargo/mutants.toml.
# `diff_min_kill_percent` applies to `make mutants-diff`: every mutant in the
# changed code must be killed.
diff_min_kill_percent = 100.0
exclude = ["src/ci_guard.rs", "src/bin/ci_guard.rs"]

# rewrite engine
[[group]]
name = "engine-core"
globs = ["src/engine/*.rs"]
min_kill_percent = 100.0

# whole crate
[[group]]
name = "crate"
globs = ["src/*.rs", "src/*/*.rs"]
min_kill_percent = 99.7

[[survivor]]
file = "src/infinite.rs"
reason = "`input_fairness_identity` is None only when a fairness document cannot be hashed, which no constructible document does; the other operands of the guard are killed"
names = [
    "replace || with && in rewrite_infinite",
]
