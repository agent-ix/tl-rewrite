[package]
name = "tl-rewrite-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
tl-rewrite = { path = ".." }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9607722f24ac1978b5e0e0ceeb0cb2a828e10177", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "11bc3dd0556c23f1339f3ecda016d9e8b911baee" }
serde_json = "=1.0.151"

[[bin]]
name = "infinite_rewrite"
path = "fuzz_targets/infinite_rewrite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "closed_rewrite"
path = "fuzz_targets/closed_rewrite.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
