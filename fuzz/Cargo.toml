[package]
name = "tl-rewrite-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tl-rewrite = { path = ".." }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "b923fd4fdf2a2bafe66fe7d20f951e50bea2210f", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "6e7056fb940f7173a66bced33f9e5b68980de35b" }
serde_json = "=1.0.151"

[[bin]]
name = "infinite_rewrite"
path = "fuzz_targets/infinite_rewrite.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
