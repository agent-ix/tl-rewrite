[package]
name = "tl-rewrite-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tl-rewrite = { path = ".." }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9de638dc4d14d0ae62a6825473a3a9bb6a9e57ac", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "98dc75727ecbfd465e09649b79cf105fc69b4c6b" }
serde_json = "=1.0.151"

[[bin]]
name = "infinite_rewrite"
path = "fuzz_targets/infinite_rewrite.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
