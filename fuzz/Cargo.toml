[package]
name = "tl-rewrite-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tl-rewrite = { path = ".." }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "08c23fa319a0ed2cf4535367b3670aa1f2033acd", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "92864c6838ef77022d4b6886e27f2be48a55d396" }
serde_json = "=1.0.151"

[[bin]]
name = "infinite_rewrite"
path = "fuzz_targets/infinite_rewrite.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
