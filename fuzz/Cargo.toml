[package]
name = "tl-rewrite-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tl-rewrite = { path = ".." }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9a4316e75d8fda6d50330d2211832c2607d6d62a", default-features = false, features = ["alloc", "serde"] }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "6a2bec0137d4059400bfec080aa07cb7a96ed33e" }
serde_json = "=1.0.151"

[[bin]]
name = "infinite_rewrite"
path = "fuzz_targets/infinite_rewrite.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
