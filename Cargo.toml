[package]
name = "tl-rewrite"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[features]
default = []
infinite-trace = ["tl-mltl/infinite-trace"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-mltl = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-mltl.git", rev = "c69a2d003f891edba1908dfe327cae03488dcd5f" }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9de638dc4d14d0ae62a6825473a3a9bb6a9e57ac", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "98dc75727ecbfd465e09649b79cf105fc69b4c6b" }
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
# The parser feeds two test seams: tests/rewrite.rs (parser-to-rewriter,
# FR-002-AC-4) and tests/future_lowering_parity.rs (clean-ascii/v2 W/M graphs,
# FR-008). tl-parse v0.3.0 compiles the same tl-syntax revision as the
# production pin, so exactly one tl-syntax and one tl-parse resolve.
# dev-dependencies are not in scope for `src/`. scripts/check_provenance.py
# still refuses any additional locked tl-syntax revision no
# `[dev-dependencies]` entry declares.
tl-parse = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-parse.git", rev = "89c2c1249c741bb94dc07da1eff46605af25e401" }

[[bench]]
name = "rewrite_rules"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
