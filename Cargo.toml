[package]
name = "tl-rewrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-mltl = { git = "https://github.com/agent-ix/tl-mltl.git", rev = "fe1c620d7baa743d9c6b4dda27f40d207721fcc9" }
tl-syntax = { git = "https://github.com/agent-ix/tl-syntax.git", rev = "740182f13b84858008d6f176f75136737d405c1b", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
proptest = "=1.5.0"
tempfile = "=3.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
