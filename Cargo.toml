[package]
name = "tl-rewrite"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[features]
default = []
infinite-trace = ["tl-mltl/infinite-trace"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-mltl = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-mltl.git", rev = "2ba6d5fbc41348bb54a966dfb222ad5fdb17f357" }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "66d012cb37508d9ed9e8a91b5b92ef440cbe81a7", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "fae80cbcfa67bbaecf0ddaf1267f0af8f42a8e34" }
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
# The parser feeds two test seams: tests/rewrite.rs (parser-to-rewriter,
# FR-002-AC-4) and tests/future_lowering_parity.rs (clean-ascii/v2 W/M graphs,
# FR-008). tl-parse v0.4.0 compiles the same tl-syntax revision as the
# production pin, so exactly one tl-syntax and one tl-parse resolve.
# dev-dependencies are not in scope for `src/`. scripts/check_provenance.py
# still refuses any additional locked tl-syntax revision no
# `[dev-dependencies]` entry declares.
tl-parse = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-parse.git", rev = "9d6e50877dd8a38e677f3f19f2782e052004fb9e" }

[[bench]]
name = "rewrite_rules"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
