[package]
name = "tl-rewrite"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[features]
default = []
infinite-trace = ["tl-mltl/infinite-trace"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-mltl = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-mltl.git", rev = "e7f9b1f5d453aeca39e14b73cf6be6ac1ac0bbf7" }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "8bcbce984f7ec3d86a92f90d866e842cc98b39fb", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "1ab90f4ed6d81932c3b8b284ec3ab44592ade397" }
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
# The parser feeds two test seams: tests/rewrite.rs (parser-to-rewriter,
# FR-002-AC-4) and tests/future_lowering_parity.rs (clean-ascii/v2 W/M graphs,
# FR-008). tl-parse v0.3.0 compiles the same tl-syntax revision as the
# production pin, so exactly one tl-syntax and one tl-parse resolve.
# dev-dependencies are not in scope for `src/`. scripts/check_provenance.py
# still refuses any additional locked tl-syntax revision no
# `[dev-dependencies]` entry declares.
tl-parse = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-parse.git", rev = "fa8232bed2d620666816a59016d479805b3f4a40" }

[profile.release]
lto = "thin"
codegen-units = 1
