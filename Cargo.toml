[package]
name = "tl-rewrite"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[features]
default = []
infinite-trace = ["tl-mltl/infinite-trace"]
# FR-091: solver-backed equivalence. Never default (NFR-076); does not enable
# tl-mltl's or tl-solve's `infinite-trace`.
solver = ["dep:tl-solve", "tl-solve/inprocess-sat"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-mltl = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-mltl.git", rev = "011a4324dba88a93eddd21ad9ba25d3c5cdc4bef" }
# UNBUILT-PIN: a80d09ed is tl-syntax origin/main on 2026-11-23, the base of the
# unbuilt TL-code branch whose TL-428 LTLf NodeKind variants and profile the
# explicit arms in src/engine/mod.rs and tests/ name. Replace with the merged
# tl-syntax rev that carries TL-414..TL-428, move tl-mltl and tl-parse to revs
# that pin that same tl-syntax (one tl-syntax package in the graph), then
# refresh Cargo.lock.
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "a80d09ed9f22c8b228c897cc2eac5b3feebd524e", default-features = false, features = ["alloc", "serde"] }
# FR-091 / NFR-076: optional, off by default, so the default normal and build
# tree is unchanged. tl-solve depends on tl-syntax and tl-mltl only, never on
# tl-rewrite (tl-solve ADR-004 cycle analysis).
# UNBUILT-PIN: tl-solve has no remote yet (TL-DECISIONS-2026-11-23 item 9);
# 0b45d0a2 is the head of the local, unbuilt `TL-147-code-unbuilt` branch and
# the URL is the planned repository. Replace both with the first pushed and
# merged tl-solve revision whose own tl-syntax and tl-mltl pins equal the ones
# above (FR-091 pin precondition, tl-solve Task-000 / FR-017-AC-6); until then
# the `solver` graph holds two tl-syntax and two tl-mltl packages and does not
# build. Refresh Cargo.lock afterwards.
tl-solve = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-solve.git", rev = "0b45d0a2e022b093128600234143f7a575f44faa", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "11bc3dd0556c23f1339f3ecda016d9e8b911baee" }
proptest = "=1.5.0"
tempfile = "=3.10.1"
# The parser feeds two test seams: tests/rewrite.rs (parser-to-rewriter,
# FR-002-AC-4) and tests/future_lowering_parity.rs (clean-ascii/v2 W/M graphs,
# FR-008).
# dev-dependencies are not in scope for `src/`.
tl-parse = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-parse.git", rev = "09191cfb9aebe0069724a28b0a648c2adfaeeb53" }

[[bench]]
name = "rewrite_rules"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
