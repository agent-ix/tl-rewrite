[package]
name = "tl-rewrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-mltl = { git = "https://github.com/agent-ix/tl-mltl.git", rev = "4bff3871ea0d157afd8de8b8c18c7954f0a7d184" }
tl-syntax = { git = "https://github.com/agent-ix/tl-syntax.git", rev = "26b801d4a68ebfe720062cfdb3c66b070ab60e92", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
tl-parse = { git = "https://github.com/agent-ix/tl-parse.git", rev = "a5c9de3ba75af6a3b5937130ddfb9f131e8e5860" }
# Test-only W/M lowering lane (FR-008, agent-ix/tl-rewrite#35). These carry the
# tl-syntax future-operator lowering and the tl-parse clean-ascii/v2 parser. The
# rename is required because Cargo cannot hold two revisions of one package under
# one name; crate code cannot reach either because dev-dependencies are not in
# scope for `src/`. Lowered graphs cross into the production tl-syntax type only
# through the formula v1 wire document. The production tl-syntax pin stays where
# tl-mltl's is until tl-mltl consumes the lowering revision, and
# scripts/check_provenance.py enforces that split.
tl-parse-derived = { package = "tl-parse", git = "https://github.com/agent-ix/tl-parse.git", rev = "9ca856b4c040fc2c3329b6defd26a1c9b57de748" }
tl-syntax-lowering = { package = "tl-syntax", git = "https://github.com/agent-ix/tl-syntax.git", rev = "8dc18eec5af227f484170362c9e8894b8531a27d", default-features = false, features = ["alloc", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
