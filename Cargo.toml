[package]
name = "tl-rewrite"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[features]
default = []
infinite-trace = ["tl-mltl/infinite-trace"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tl-mltl = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-mltl.git", rev = "7a232c0a895f6d42de3a19b8dbb86e6871cd12dd" }
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "08c23fa319a0ed2cf4535367b3670aa1f2033acd", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
tl-oracle = { version = "=0.1.0", git = "https://github.com/agent-ix/tl-oracle.git", rev = "92864c6838ef77022d4b6886e27f2be48a55d396" }
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
# The parser feeds two test seams: tests/rewrite.rs (parser-to-rewriter,
# FR-002-AC-4) and tests/future_lowering_parity.rs (clean-ascii/v2 W/M graphs,
# FR-008). tl-parse v0.4.0 compiles the same tl-syntax revision as the
# production pin, so exactly one tl-syntax and one tl-parse resolve.
# dev-dependencies are not in scope for `src/`. scripts/check_provenance.py
# still refuses any additional locked tl-syntax revision no
# `[dev-dependencies]` entry declares.
tl-parse = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-parse.git", rev = "e8b1a9cc844a9846b6638b8f2ad8949b1f49677f" }

[[bench]]
name = "rewrite_rules"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
