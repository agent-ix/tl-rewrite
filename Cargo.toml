[package]
name = "tl-rewrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic semantics-preserving rewrites for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-rewrite"

[lib]
name = "tl_rewrite"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tl-mltl = { git = "https://github.com/agent-ix/tl-mltl.git", rev = "7c0dba3f06987710a01a6143333c80251b85b196" }
tl-syntax = { git = "https://github.com/agent-ix/tl-syntax.git", rev = "2e6bd6a297a75bb4eed9ea96d5083611283a4214", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
tl-parse = { git = "https://github.com/agent-ix/tl-parse.git", rev = "b8fcef718c8ceb9e13d56a8516f16b01d8f5df37" }

[profile.release]
lto = "thin"
codegen-units = 1
