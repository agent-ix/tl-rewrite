[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2
db-path = "$CARGO_HOME/tl-rewrite-advisory-db"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Exact-source exceptions for three git dependencies, all pinned to revisions
# reachable from their own `main`. The tl-parse dependency is dev-only and
# exercises the real parser-to-rewriter seam; it is not linked into production.
# The tl-syntax and tl-mltl pins must move together because
# src/equivalence.rs passes tl_syntax::Formula values into
# tl_mltl::evaluate_closed. scripts/check_provenance.py enforces that the
# crate's published production-dependency revision constants agree with
# Cargo.toml and Cargo.lock.
allow-git = [
    "https://github.com/agent-ix/tl-mltl.git",
    "https://github.com/agent-ix/tl-parse.git",
    "https://github.com/agent-ix/tl-syntax.git",
]
