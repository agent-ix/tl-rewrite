[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Temporary exact-source exceptions until the upstream PRs merge or 2026-09-07,
# whichever comes first. AA-001 blocks source release while either is open.
allow-git = [
    "https://github.com/agent-ix/tl-mltl.git",
    "https://github.com/agent-ix/tl-syntax.git",
]
