[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2
db-path = "$CARGO_HOME/tl-rewrite-advisory-db"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Exact-source exceptions for two git dependencies, both pinned to revisions
# reachable from their own `main`: tl-syntax 953ee825 and tl-mltl f7eb8bdf.
# These are no longer time-boxed exceptions for pull-request branches, and
# neither blocks the source-release claim. The pins must move together —
# src/equivalence.rs passes tl_syntax::Formula values into
# tl_mltl::evaluate_closed, so both crates have to resolve the same tl-syntax
# revision — and scripts/check_provenance.py enforces that the crate's published
# revision constants agree with Cargo.toml and Cargo.lock.
allow-git = [
    "https://github.com/agent-ix/tl-mltl.git",
    "https://github.com/agent-ix/tl-syntax.git",
]
